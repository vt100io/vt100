# Deployed with unit (github.com/vt100io/unit): mise run build, then unit deploy.
name       = "vt100"
executable = "bin/vt100"
port       = 8080 # systemd holds the socket and hands it to the site
# Caddy serves both names with Let's Encrypt certificates; the site
# redirects www to the bare domain itself.
domain     = "vt100.io, www.vt100.io"

# Deploy only commits that Punchcard has built and passed.
ci_check   = "punchcard/ci"

[server]
host = "vt100" # over Tailscale
user = "deploy"

[resources]
memory_max = "128M"
